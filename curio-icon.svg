<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Curio app icon — reference SVG.
    Archive-quality source-of-truth for the launcher design. The Android
    launcher actually consumes the VectorDrawable XML in
    app/src/main/res/drawable/ic_launcher_foreground.xml + ic_launcher_background.xml,
    but this .svg mirrors that composition in portable SVG for design-tool
    preview (Figma/Illustrator), web previews, and as a regression-check
    against future VisualDesignSystem refactors.

    Redesigned: replaces the 6-wedge wheel from commit ac9a0742 with a
    cleaner 3-wedge design on a coral background. See the corresponding
    XML files for the full design rationale.

    See:
      - CURIO_SPEC.md section 13.1 (splash/icon logomark)
      - CURIO_SPEC.md section 0.2 (palette)
      - app/src/main/res/drawable/ic_launcher_foreground.xml (compiled form)
      - app/src/main/res/drawable/ic_launcher_background.xml (compiled form)

    Coordinate system: 108x108 viewBox (matches Android adaptive-icon).
    Safe zone: 66dp diameter centered at (54,54).

    Layer order (back to front):
      1. coral rectangle (background, gets cropped by launcher mask)
      2. cream wheel circle (r=30 at 54,54)
      3. 3 roulette wedges (clockwise from 12 o'clock)
         - W1 (12-4):   butter yellow
         - W2 (4-8):    sky mint
         - W3 (8-12):   lilac
      4. pointer (deep plum triangle, apex at wheel top edge)
      5. sparkle (butter yellow 4-point star, top-left at 24,24)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 108 108" width="108" height="108">

  <!-- ── Background ─────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="108" height="108" fill="#FF8FA3" />

  <!-- ── Wheel body (cream circle) ──────────────────────────────────── -->
  <circle cx="54" cy="54" r="30" fill="#FFFBF5" />

  <!-- ── Wedge 1 (12→4 o'clock) : Butter Yellow ─────────────────────── -->
  <path d="M 54 54 L 54 24 A 30 30 0 0 1 79.98 69 Z"
        fill="#FFD97D" />

  <!-- ── Wedge 2 (4→8 o'clock) : Sky Mint ─────────────────────────── -->
  <path d="M 54 54 L 79.98 69 A 30 30 0 0 1 28.02 69 Z"
        fill="#8FE3CF" />

  <!-- ── Wedge 3 (8→12 o'clock) : Lilac ────────────────────────────── -->
  <path d="M 54 54 L 28.02 69 A 30 30 0 0 1 54 24 Z"
        fill="#C9A6F2" />

  <!-- ── Pointer at top of dial (deep plum triangle) ────────────────── -->
  <path d="M 54 24 L 50 14 L 58 14 Z" fill="#3B0A17" />

  <!-- ── Sparkle (butter yellow 4-point star, top-left) ─────────────── -->
  <path d="M 24 18 L 26 22 L 30 24 L 26 26 L 24 30 L 22 26 L 18 24 L 22 22 Z"
        fill="#FFD97D" />
</svg>