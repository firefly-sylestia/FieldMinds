<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Curio app icon — reference SVG (polished).

    Polish iteration on commit f68af31a. Three refinements for better color
    cohesion and brand consistency:

      1. BRAND TITLE BAR: title bar swapped from Soft Sand #F6EFE4 to
         Coral Blush #FF8FA3 (the brand primary, also the background
         color). Coral-on-cream reads as a deliberate brand accent and
         ties the deck to the background visually. At 24dp launcher
         size the title bar disappears, but at 48dp+ the brand
         presence is felt at every size.

      2. HIGH-CONTRAST SUBTITLE: subtitle bar swapped from Soft Sand
         (almost identical to the front card's Cream White) to Deep
         Plum #3B0A17. At 24dp the subtitle disappears entirely; at
         48dp+ it's the only "ink" on the front card and Deep Plum
         gives much better definition than the previous Sand-on-Cream.

      3. TONAL DEPTH (new at SVG fidelity): the two back cards now
         carry a top-to-bottom linearGradient that warms each one
         toward the next color in the palette:
            Card 1: Dusty Blue (#9BB8E8) top → Lilac (#C9A6F2) bottom
            Card 2: Lilac       (#C9A6F2) top → Sage  (#A8C99A) bottom
         This gives the deck subtle "shuffle warmth" at large sizes
         (96dp+) without changing the brand silhouette at 24dp.
         A soft drop shadow (feDropShadow, 25% opacity) is added under
         Card 3 for a touch of layering depth.

    The Android VectorDrawable (ic_launcher_foreground.xml) ships
    without these gradients because VectorDrawable doesn't natively
    support gradient fills or drop shadows without an <aapt:attr>
    wrapper. At 24dp launcher scale the gradient is invisible anyway,
    so the structural composition (3 offset cards, focal cream card,
    brand title bar) is what reads.

    See:
      - CURIO_SPEC.md section 13.1 (splash/icon logomark)
      - CURIO_SPEC.md section 0.2 (palette)
      - app/src/main/res/drawable/ic_launcher_foreground.xml (compiled)
      - app/src/main/res/drawable/ic_launcher_background.xml (compiled)

    Coordinate system: 108x108 viewBox (matches Android adaptive-icon).

    Layer order (back to front):
      1. coral rectangle (background, gets cropped by launcher mask)
      2. Card 1 (back):    Dusty Blue → Lilac vertical gradient, rotated -6 around (32, 48)
      3. Card 2 (middle): Lilac → Sage      vertical gradient, rotated +4 around (44, 52)
      4. Card 3 (front):   Cream White solid, drop shadow filter, no rotation
      5. inside front card:
         a. image placeholder: Butter Yellow 32x28 with rx=4 at (38,32)
         b. title bar:         Coral Blush  24x5 at (38,65)        — BRAND
         c. subtitle bar:      Deep Plum    16x4 at (38,73)        — HIGH CONTRAST
         d. sparkle:           Deep Plum 4-point star at (74,30)
--><svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 108 108" width="108" height="108">

  <defs>
    <!-- Card 1: Dusty Blue → Lilac vertical gradient -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BB8E8"/>
      <stop offset="100%" stop-color="#C9A6F2"/>
    </linearGradient>

    <!-- Card 2: Lilac → Sage vertical gradient -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A6F2"/>
      <stop offset="100%" stop-color="#A8C99A"/>
    </linearGradient>

    <!-- Soft drop shadow under Card 3 -->
    <filter id="card3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#3B0A17" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="108" height="108" fill="#FF8FA3" />

  <!-- Card 1 (back): Dusty Blue → Lilac gradient, rotated -6 deg around (32, 48) -->
  <rect x="4" y="16" width="56" height="64" rx="6" ry="6"
        fill="url(#card1Grad)" transform="rotate(-6 32 48)" />

  <!-- Card 2 (middle): Lilac → Sage gradient, rotated +4 deg around (44, 52) -->
  <rect x="16" y="20" width="56" height="64" rx="6" ry="6"
        fill="url(#card2Grad)" transform="rotate(4 44 52)" />

  <!-- Card 3 (front): Cream White solid, soft drop shadow, no rotation -->
  <rect x="26" y="24" width="56" height="64" rx="6" ry="6"
        fill="#FFFBF5" filter="url(#card3Shadow)" />

  <!-- Image placeholder (butter yellow) -->
  <rect x="38" y="32" width="32" height="28" rx="4" ry="4" fill="#FFD97D" />

  <!-- Title bar (Coral Blush brand accent, 5dp thick) -->
  <rect x="38" y="65" width="24" height="5" fill="#FF8FA3" />

  <!-- Subtitle bar (Deep Plum, 4dp thick) -->
  <rect x="38" y="73" width="16" height="4" fill="#3B0A17" />

  <!-- Sparkle: deep plum 4-point star on the image area -->
  <path d="M 74,26 L 76,28 L 78,30 L 76,32 L 74,34 L 72,32 L 70,30 L 72,28 Z"
        fill="#3B0A17" />
</svg>