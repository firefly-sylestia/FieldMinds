# wrangler.toml — FieldMind Bug Reporter Worker
# Install wrangler: `npm install -g wrangler`
# Login:           `wrangler login`
# Set secrets:     `wrangler secret put GITHUB_TOKEN`
#                  `wrangler secret put GITHUB_OWNER`
#                  `wrangler secret put GITHUB_REPO`
# Deploy:          `wrangler deploy`
# Local dev:       `wrangler dev`

name = "fieldmind-bug-reporter"
main = "worker.js"
compatibility_date = "2024-10-01"

# Secrets — bind via `wrangler secret put …` or in the Cloudflare dashboard.
# DO NOT put real values here. This file is safe to commit.

[observability]
enabled = true

# Optional: restrict which origins can hit the worker.
# Android client identifies as `okhttp/4.x`; if you want to gate on that,
# add a Cloudflare WAF rule rather than blocking here.
