name: Curio Android CI

on:
  push:
    branches: [revamp]
  pull_request:
    branches: [revamp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, lint, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37 and build-tools
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager=$(find "$android_home/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          yes | "$sdkmanager" --sdk_root="$android_home" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$android_home" "platforms;android-37" "build-tools;35.0.0"
          test -d "$android_home/platforms/android-37"
          test -x "$android_home/build-tools/35.0.0/apksigner"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate topic catalogs without Gradle
        run: python3 scripts/validate_topics.py

      - name: Run Android checks and build debug APK
        run: ./gradlew lintDebug validateTopics assembleDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: curio-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results*.*
            app/build/reports/lint/**/*.html
            app/build/reports/lint/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: curio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14