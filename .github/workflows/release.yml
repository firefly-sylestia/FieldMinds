name: Build Release APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # Find sdkmanager (handle versioned cmdline-tools dirs)
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name 'sdkmanager' -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Reuses the legacy FieldMind keystore via the existing
      # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets.
      # app/build.gradle.kts reads these env vars at build time and signs the
      # release APK with them when all four are present; when missing (e.g.
      # during initial setup before secrets are configured), the release
      # buildType falls back to debug signing so the workflow still passes.

      - name: Decode keystore from secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          # Strip whitespace before base64-decode in case the secret was
          # pasted with line breaks — base64 ignores whitespace but some
          # implementations refuse mid-pipeline newlines.
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore

      - name: Build release universal APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Debug-build fallback (no keystore secrets configured)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          echo "⚠️  Keystore secrets not configured — building debug APK as fallback."
          echo "Populate KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
          echo "in repo Settings > Secrets and variables > Actions for a signed release."
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK outputs (unsigned APKs are treated as a build failure)
        run: |
          set -uo pipefail
          echo "=== APK outputs ==="
          find app/build/outputs/apk -type f -name '*.apk' -print || true
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -1)
          debug_apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -1)
          if [ -z "$release_apk" ] && [ -z "$debug_apk" ]; then
            unsigned_found=$(find app/build/outputs/apk -type f -name '*-unsigned.apk' 2>/dev/null | head -1 || true)
            if [ -n "$unsigned_found" ]; then
              echo "::error::Found an unsigned APK at $unsigned_found but no signed APK. Add a signing config to app/build.gradle.kts."
            else
              echo "::error::No APKs found at all. Build may have failed."
            fi
            exit 1
          fi
          if [ -n "$release_apk" ]; then echo "✅ Release APK: $release_apk"; fi
          if [ -n "$debug_apk" ]; then echo "✅ Debug APK (fallback): $debug_apk"; fi

      - name: Set prerelease flag
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Github Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
