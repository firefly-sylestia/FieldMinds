name: Curio Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: curio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37 and build-tools
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager=$(find "$android_home/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          yes | "$sdkmanager" --sdk_root="$android_home" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$android_home" "platforms;android-37" "build-tools;35.0.0"
          test -d "$android_home/platforms/android-37"
          test -x "$android_home/build-tools/35.0.0/apksigner"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release signing secrets: ${missing[*]}"
            echo "Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.keystore
          size=$(wc -c < release.keystore)
          if [ "$size" -lt 100 ]; then
            echo "::error::Decoded release keystore is unexpectedly small (${size} bytes)."
            exit 1
          fi
          echo "Release keystore decoded (${size} bytes)."

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew validateTopics assembleRelease --stacktrace

      - name: Verify release APK and signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          echo "Release APK: $apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$sdk_root/build-tools/35.0.0/apksigner"
          if [ -z "$apksigner" ]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk"
          if "$apksigner" verify --print-certs "$apk" 2>&1 | grep -q 'CN=Android Debug'; then
            echo "::error::Release APK is signed with the Android debug key."
            exit 1
          fi

      - name: Determine prerelease status
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true