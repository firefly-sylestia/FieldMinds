name: Build Release APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # Find sdkmanager (handle versioned cmdline-tools dirs)
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name 'sdkmanager' -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # NOTE: release-key signing configuration is deliberately deferred until
      # Phase 4+ when Curio's distribution-channel logic lands. The legacy
      # KeyStoreBase64 + KEYSTORE_* env-var pipeline lived only in
      # app-legacy/build.gradle.kts and is not carried over.

      - name: Build release universal APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK outputs (unsigned APKs are treated as a build failure)
        run: |
          set -uo pipefail
          echo "=== APK outputs ==="
          find app/build/outputs/apk -type f -name '*.apk' -print || true
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -1)
          if [ -z "$release_apk" ]; then
            unsigned_found=$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' 2>/dev/null | head -1 || true)
            if [ -n "$unsigned_found" ]; then
              echo "::error::Found an unsigned APK at $unsigned_found but no signed APK. Add a signing config to app/build.gradle.kts."
            else
              echo "::error::No release APK found at app/build/outputs/apk/release/. Build may have failed."
            fi
            exit 1
          fi
          echo "✅ Release APK: $release_apk"

      - name: Set prerelease flag
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Github Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
