name: Feature request
description: Suggest an improvement to Curio's discovery, capture, or library experience
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Curio is designed around discovering a topic, exploring it in the real world, and keeping the result in The Cabinet. Explain how your idea improves that loop.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user problem, friction, or unmet need should Curio address?
      placeholder: When I am trying to…, it is difficult to…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the user should be able to do and where it belongs in the app.
      placeholder: |
        The user opens…
        They can then…
        The result appears in…
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Home and navigation
        - Spin and discovery
        - Topic data and categories
        - Capture and editing
        - Cabinet and search
        - Entry detail
        - Profile, Settings, or Experiments
        - Backup, restore, or accessibility
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Expected scope
      description: Your estimate is only a starting point; maintainers will decide the final scope.
      options:
        - Small polish or interaction improvement
        - New screen or capture capability
        - Topic data or category expansion
        - Larger architectural change
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried?

  - type: textarea
    id: references
    attributes:
      label: Examples and references
      description: Add sketches, screenshots, links, or examples from other apps. Do not include copyrighted material you do not have permission to share.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is about Curio rather than a general Android feature.
          required: true